apiVersion: v1
kind: Pod
metadata:
  name: ollama-gpu
  namespace: default
spec:
  nodeSelector:
    accelerator: nvidia-gpu
  containers:
  - name: ollama
    image: ollama/ollama:latest
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 11434
    env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: "all"
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: "compute,utility"
    resources:
      requests:
        memory: "2Gi"
      limits:
        memory: "3Gi"
    volumeMounts:
    - name: ollama-data
      mountPath: /root/.ollama
  volumes:
  - name: ollama-data
    emptyDir: {}
