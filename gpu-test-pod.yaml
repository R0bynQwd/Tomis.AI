apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
  namespace: default
spec:
  nodeSelector:
    accelerator: nvidia-gpu
  containers:
  - name: gpu-test
    image: ubuntu:20.04
    imagePullPolicy: IfNotPresent
    command: ["/bin/bash"]
    args: ["-c", "apt-get update -qq && apt-get install -y nvidia-utils >& /dev/null; echo '=== GPU Devices ==='; ls -la /dev/nvidia* 2>&1 || echo 'No GPU devices found'; echo '=== NVIDIA-SMI ==='; nvidia-smi 2>&1 || echo 'NVIDIA tools not available'; sleep 300"]
    volumeMounts:
    - name: nvidia-devices
      mountPath: /dev/nvidia0
      subPath: nvidia0
    - name: nvidia-devices
      mountPath: /dev/nvidiactl
      subPath: nvidiactl
  volumes:
  - name: nvidia-devices
    hostPath:
      path: /dev
