apiVersion: v1
kind: Namespace
metadata:
  name: tomis-ai
---
# [28002] Whisper ASR
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomis-asr
  namespace: tomis-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr
  template:
    metadata:
      labels:
        app: asr
    spec:
      containers:
      - name: whisper
        image: onerahmet/openai-whisper-asr-webservice:latest-gpu
        ports:
        - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: asr-service
  namespace: tomis-ai
spec:
  type: NodePort
  ports:
  - port: 9000
    targetPort: 9000
    nodePort: 28002
  selector:
    app: asr
---
# [28003] OCR Engine
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomis-ocr
  namespace: tomis-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocr
  template:
    metadata:
      labels:
        app: ocr
    spec:
      containers:
      - name: tesseract
        image: franky1/tesseract:latest
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-service
  namespace: tomis-ai
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 28003
  selector:
    app: ocr
---
# [28010] LLM Engine (Ollama)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomis-llm
  namespace: tomis-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
---
apiVersion: v1
kind: Service
metadata:
  name: llm-service
  namespace: tomis-ai
spec:
  type: NodePort
  ports:
  - port: 11434
    targetPort: 11434
    nodePort: 28010
  selector:
    app: llm
